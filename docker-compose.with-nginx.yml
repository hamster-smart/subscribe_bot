services:

  bot:
    build: .
    container_name: vipsub_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - vipsub

  webhook:
    build: .
    container_name: vipsub_webhook
    restart: unless-stopped
    env_file: .env
    command: uvicorn webhook_server:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"                  # порт только внутри сети (nginx проксирует)
    volumes:
      - ./data:/app/data
    networks:
      - vipsub

  nginx:
    image: nginx:alpine
    container_name: vipsub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # SSL-сертификаты (certbot)
    depends_on:
      - webhook
    networks:
      - vipsub

networks:
  vipsub:
    driver: bridge
