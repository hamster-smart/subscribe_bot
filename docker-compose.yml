services:

  bot:
    build: .
    container_name: vipsub_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data        # база данных живёт на хосте
    depends_on:
      - webhook
    networks:
      - vipsub

  webhook:
    build: .
    container_name: vipsub_webhook
    restart: unless-stopped
    env_file: .env
    command: uvicorn webhook_server:app --host 0.0.0.0 --port 8080
#   ports:
    expose:
      - "8080"             # если nginx/Caddy нет — открыть напрямую
    volumes:
      - ./data:/app/data
    networks:
      - vipsub
      - caddy-proxy

networks:
  vipsub:
    driver: bridge
  caddy-proxy:
    name: caddy-proxy
    external: true
